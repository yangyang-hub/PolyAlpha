[chain]
chain_id = 137
rpc_url = "https://polygon-mainnet.g.alchemy.com/v2/5bVIx7BUkCsGm-EQ0st5JMz9lYwaf6Qa"
rpc_fallbacks = [
    "https://1rpc.io/matic",
    "https://polygon.drpc.org",
]

[clob]
host = "https://clob.polymarket.com"
ws_host = "wss://ws-subscriptions-clob.polymarket.com"
# Signature type: 0=EOA, 1=Proxy(email wallet), 2=GnosisSafe(browser wallet proxy)
# Use 2 if you deposited funds through the Polymarket website
signature_type = 2
# Polymarket proxy wallet address for Data API position loading.
# Leave empty to fallback to the EOA signer address.
proxy_wallet = "xxxx"

[gamma]
host = "https://gamma-api.polymarket.com"

[strategy]
# enabled = ["weather", "crypto"]
enabled = ["weather", "crypto"]
scan_interval_ms = 100
min_spread_bps = 200
min_profit_usdc = 0.20
max_trade_size_usdc = 500.0
order_type = "FOK"
max_market_end_days = 3

[risk]
max_position_per_market = 5.0
max_total_exposure = 10.0
max_daily_loss = 5.0
circuit_breaker_loss = 8.0
circuit_breaker_consecutive_losses = 5
max_slippage_bps = 50
min_order_usdc = 1.0
min_profit_usdc = 0.01
max_exposure_per_strategy = 5000.0
max_markets_per_strategy = 50

[database]
url = ""
max_connections = 10

[monitor]
prometheus_port = 9090
health_port = 18381
alert_webhook = ""

[market_filter]
min_liquidity = 100.0
min_volume_24h = 500.0
max_markets = 500
ws_max_instruments = 350
market_refresh_interval_secs = 1800  # 30 min

[weather]
min_edge_bps = 500
max_spread_bps = 1700
max_position_pct = 0.50
kelly_fraction = 0.25
refresh_interval_secs = 120          # Every 2 minutes
exit_buffer_bps = 50
capital_efficiency_threshold = 0.98
dynamic_sigma = true
forecast_change_detection = false    # Disabled by default; weather forecasts usually change slowly
forecast_change_threshold = 0.35
max_entry_price = 0.35               # Allow moderately priced tokens instead of only extreme longshots
relative_stop_loss_ratio = 0.80      # Exit when bid falls below 80% of average cost
max_position_usdc = 4.0              # Max $4 per trade while weather exits are being tuned
noaa_user_agent = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/146.0.0.0 Safari/537.36"
kma_api_key = ""                     # Optional: required for Seoul/KMA forecast access
met_office_api_key = ""              # Optional: required for London/Met Office forecast access
met_office_obs_api_key = ""          # Optional: required for London/Met Office observations access
target_cities = []

[weather.forecast_error]
temperature_sigma_f = 3.0
precipitation_sigma_in = 0.3
snowfall_sigma_in = 2.0
wind_sigma_mph = 5.0

