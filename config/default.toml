[chain]
chain_id = 137
rpc_url = "https://polygon-rpc.com"
rpc_fallbacks = [
    "https://rpc.ankr.com/polygon",
]

[clob]
host = "https://clob.polymarket.com"
ws_host = "wss://ws-subscriptions-clob.polymarket.com"
# Signature type: 0=EOA, 1=Proxy(email wallet), 2=GnosisSafe(browser wallet proxy)
# Use 2 if you deposited funds through the Polymarket website
signature_type = 2

[gamma]
host = "https://gamma-api.polymarket.com"

[strategy]
enabled = ["weather", "convergence", "crypto"]
scan_interval_ms = 100
min_spread_bps = 200
min_profit_usdc = 0.20
max_trade_size_usdc = 500.0
order_type = "FOK"

[risk]
max_position_per_market = 2000.0
max_total_exposure = 10000.0
max_daily_loss = 500.0
circuit_breaker_loss = 1000.0
circuit_breaker_consecutive_losses = 5
max_slippage_bps = 50
min_order_usdc = 1.0
min_profit_usdc = 0.01

[database]
url = "postgresql://polyalpha:polyalpha@localhost:5432/polyalpha"
max_connections = 10

[monitor]
prometheus_port = 9090
health_port = 18381
alert_webhook = ""

[market_filter]
min_liquidity = 100.0
min_volume_24h = 500.0
max_markets = 500
ws_max_instruments = 1000

[weather]
min_edge_bps = 500
max_position_usdc = 50.0
kelly_fraction = 0.25
refresh_interval_secs = 3600

[weather.forecast_error]
temperature_sigma_f = 3.0
precipitation_sigma_in = 0.3
snowfall_sigma_in = 2.0
wind_sigma_mph = 5.0

[convergence]
min_price_threshold = 0.93
max_days_to_resolution = 7
max_position_usdc = 100.0
kelly_fraction = 0.25
time_decay_boost = true

[crypto_alpha]
min_edge_bps = 500
max_position_usdc = 100.0
kelly_fraction = 0.25
refresh_interval_secs = 300
coingecko_api_key = ""

[event_calendar]
enabled = false
finnhub_api_key = ""
coinmarketcal_api_key = ""
refresh_interval_secs = 3600
pre_event_hours = 4
post_event_hours = 2
high_impact_multiplier = 0.25
medium_impact_multiplier = 0.50
low_impact_multiplier = 0.75
