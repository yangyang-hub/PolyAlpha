[chain]
chain_id = 137
rpc_url = "https://polygon-mainnet.g.alchemy.com/v2/5bVIx7BUkCsGm-EQ0st5JMz9lYwaf6Qa"
rpc_fallbacks = [
    "https://1rpc.io/matic",
    "https://polygon.drpc.org",
]

[clob]
host = "https://clob.polymarket.com"
ws_host = "wss://ws-subscriptions-clob.polymarket.com"
# Signature type: 0=EOA, 1=Proxy(email wallet), 2=GnosisSafe(browser wallet proxy)
# Use 2 if you deposited funds through the Polymarket website
signature_type = 2
# Polymarket proxy wallet address for Data API position loading.
# Leave empty to fallback to the EOA signer address.
proxy_wallet = "0x92D8cF3B70178f8C374AeE25f311c0B4FE398dC5"

[gamma]
host = "https://gamma-api.polymarket.com"

[strategy]
enabled = ["weather", "convergence", "crypto"]
# enabled = ["weather"]
scan_interval_ms = 100
min_spread_bps = 200
min_profit_usdc = 0.20
max_trade_size_usdc = 500.0
order_type = "FOK"
max_market_end_days = 3

[risk]
max_position_per_market = 5.0
max_total_exposure = 10.0
max_daily_loss = 5.0
circuit_breaker_loss = 8.0
circuit_breaker_consecutive_losses = 5
max_slippage_bps = 50
min_order_usdc = 1.0
min_profit_usdc = 0.01
max_exposure_per_strategy = 5000.0
max_markets_per_strategy = 50

[database]
url = "postgresql://polyalpha:polyalpha@localhost:5432/polyalpha"
max_connections = 10

[monitor]
prometheus_port = 9090
health_port = 18381
alert_webhook = ""

[market_filter]
min_liquidity = 100.0
min_volume_24h = 500.0
max_markets = 500
ws_max_instruments = 500
market_refresh_interval_secs = 1800  # 30 min

[weather]
min_edge_bps = 300
max_position_pct = 0.50
kelly_fraction = 0.25
refresh_interval_secs = 3600
exit_buffer_bps = 50
capital_efficiency_threshold = 0.98
dynamic_sigma = true
ensemble_enabled = false
ensemble_models = ["gfs_seamless", "ecmwf_ifs025", "icon_seamless"]
forecast_change_detection = false
forecast_change_threshold = 0.5

[weather.forecast_error]
temperature_sigma_f = 3.0
precipitation_sigma_in = 0.3
snowfall_sigma_in = 2.0
wind_sigma_mph = 5.0

[convergence]
min_price_threshold = 0.80
max_days_to_resolution = 14
max_position_pct = 0.50
kelly_fraction = 0.25
time_decay_boost = true
time_decay_rate = 0.05
exit_buffer_bps = 50
capital_efficiency_threshold = 0.98

[crypto_alpha]
min_edge_bps = 50
max_position_pct = 0.50
kelly_fraction = 0.25
refresh_interval_secs = 300
coingecko_api_key = ""
exit_buffer_bps = 50
capital_efficiency_threshold = 0.98

[event_calendar]
enabled = false
finnhub_api_key = ""
coinmarketcal_api_key = ""
refresh_interval_secs = 3600
pre_event_hours = 4
post_event_hours = 2
high_impact_multiplier = 0.25
medium_impact_multiplier = 0.50
low_impact_multiplier = 0.75

[market_making]
enabled = false
target_spread_bps = 300
max_position_per_market = 50.0
max_markets = 5
quote_refresh_secs = 30
inventory_skew_factor = 0.50
