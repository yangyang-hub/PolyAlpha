[event_calendar]
enabled = false
finnhub_api_key = ""
coinmarketcal_api_key = ""
refresh_interval_secs = 3600
pre_event_hours = 4
post_event_hours = 2
high_impact_multiplier = 0.25
medium_impact_multiplier = 0.50
low_impact_multiplier = 0.75

[liquidity_rewards]
enabled = true
max_markets = 10
max_position_per_market = 100.0
max_total_exposure = 500.0
market_refresh_secs = 1800
quote_refresh_secs = 60
spread_fraction = 0.80
min_order_size = 5.0
inventory_skew_factor = 0.50
min_daily_rate = 1.0
requote_trigger_bps = 30
requote_cooldown_secs = 3
verify_scoring = false
quote_yes = true
quote_no = true
fill_check_secs = 10
order_depth_level = 3       # 0 = legacy midpoint mode, N = place at Nth orderbook level
cancel_depth_level = 2      # cancel and re-quote when order reaches this depth

# ──── Multi-Account Configuration ────
# Define named accounts to run different strategies with different wallets.
# Trading is disabled unless accounts are provided here or via PA_ACCOUNT_<N>_* env vars.
#
# [[accounts]]
# name = "main"
# private_key_env = "POLYMARKET_PRIVATE_KEY"
# signature_type = 2
# proxy_wallet = "0x..."
# strategies = ["weather", "crypto"]
#
# [[accounts]]
# name = "lr_bot"
# private_key_env = "POLYMARKET_PRIVATE_KEY_2"
# signature_type = 2
# proxy_wallet = "0x..."
# strategies = ["liquidity_rewards"]

[smart_money]
# wallets = [
#   { address = "0x1234...", label = "whale_1", weight = 1.0 },
#   { address = "0x5678...", label = "whale_2", weight = 0.8 },
# ]
follow_ratio = 0.10               # Follow 10% of tracked wallet's position
max_position_usdc = 100.0          # Max position per market
poll_interval_secs = 30            # Data API poll interval
signal_ttl_secs = 300              # Signal expires after 5 minutes
exit_buffer_bps = 50
capital_efficiency_threshold = 0.98
onchain_enabled = false            # On-chain Transfer event monitoring
onchain_poll_secs = 4
auto_discover_enabled = false
auto_discover_candidates = []
auto_discover_interval_secs = 3600
min_wallet_score = 0.05            # 5% P&L-to-volume ratio
max_wallets = 20
