services:
  polyalpha:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: polyalpha-bot
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - RUN_MODE=production
    # 使用 host 网络直接访问宿主机上的 PostgreSQL / Prometheus / Grafana
    network_mode: host
