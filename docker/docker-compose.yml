services:
  polyalpha:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: polyalpha-bot
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - RUN_MODE=production
      - PA_DATABASE__URL=postgresql://polyalpha:polyalpha@postgres:5432/polyalpha
    ports:
      - "8080:8080"   # Health check
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - polyalpha

  postgres:
    image: postgres:16-alpine
    container_name: polyalpha-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: polyalpha
      POSTGRES_PASSWORD: polyalpha
      POSTGRES_DB: polyalpha
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polyalpha"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - polyalpha

  prometheus:
    image: prom/prometheus:latest
    container_name: polyalpha-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - promdata:/prometheus
    ports:
      - "9090:9090"
    networks:
      - polyalpha

  grafana:
    image: grafana/grafana:latest
    container_name: polyalpha-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - polyalpha

volumes:
  pgdata:
  promdata:
  grafanadata:

networks:
  polyalpha:
    driver: bridge
